<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Durweg</title>
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<header><h1>Durweg</h1><span id="version"></span><button type="button" id="update_all" class="write" data-t="update_all"></button></header>
<p id="restart" class="warn" hidden data-t="restart"></p>
<p id="notoken" class="warn" hidden data-t="notoken"></p>
<nav>
  <button type="button" class="tab" data-tab="browse" data-t="tab_browse"></button>
  <button type="button" class="tab" data-tab="installed" data-t="tab_installed"></button>
  <button type="button" class="tab" data-tab="env" data-t="tab_env"></button>
</nav>
<main>
  <section id="browse" hidden>
    <p class="hint" data-t="browse_hint"></p>
    <div id="browse_notes"></div>
    <div id="browse_list" class="list"></div>
  </section>
  <section id="installed" hidden>
    <p class="hint" data-t="installed_hint"></p>
    <div id="installed_list" class="list"></div>
  </section>
  <section id="env" hidden>
    <div id="env_list" class="list"></div>
    <h2 data-t="catalogs"></h2>
    <div id="catalog_list" class="list"></div>
    <form id="catalog_form" class="row">
      <input id="catalog_id" type="text" maxlength="32" autocomplete="off" data-ph="catalog_id">
      <input id="catalog_url" type="text" maxlength="300" autocomplete="off" data-ph="catalog_url">
      <button type="submit" class="write" data-t="catalog_add"></button>
    </form>
    <p><button type="button" id="private_preview" class="write" data-t="private_preview"></button></p>
    <div id="private_box" class="card" hidden>
      <p id="private_would"></p>
      <button type="button" id="private_create" class="write" data-t="private_create"></button>
    </div>
    <button type="button" id="recheck" data-t="recheck"></button>
  </section>
  <div id="tasks_box" hidden>
    <h2 data-t="tasks"></h2>
    <div id="tasks_list" class="list"></div>
  </div>
  <div id="copybox" class="copy" hidden>
    <p id="copy_where"></p>
    <input id="copy_text" type="text" readonly>
    <button type="button" id="copy_btn" data-t="copy"></button>
    <span id="copy_state"></span>
  </div>
</main>
</body>
</html>
